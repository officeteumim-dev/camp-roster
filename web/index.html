<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24492c">
<title>Camp Roster</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* top bar: menu button, camp name, page title */
  .iconbtn { width: var(--ctl); height: var(--ctl); min-height: 0; padding: 0; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; box-shadow: none; color: inherit; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .iconbtn svg { width: 19px; height: 19px; }
  header.top .iconbtn:hover { background: rgb(255 255 255 / .1); }
  #pageTitle { font-weight: 500; font-size: 14px; color: var(--head-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-left: 12px; border-left: 1px solid var(--head-line); }
  @media (max-width: 520px) { #pageTitle { display: none; } }

  /* logo (same sizes and places as the SFSP app's) */
  .logo { width: 30px; height: 30px; flex: none; border-radius: 7px; display: inline-block; background: url(/icons/icon-192.png) center/cover no-repeat; box-shadow: 0 0 0 1px rgb(255 255 255 / .16); }
  .drawer-head .logo { box-shadow: none; }
  .foot-brand { display: none; align-items: center; gap: 8px; padding-top: 8px; }
  .foot-brand .logo { width: 24px; height: 24px; border-radius: 6px; box-shadow: none; }
  .signin .logo { display: block; width: 72px; height: 72px; border-radius: 16px; margin: 0 auto 14px; box-shadow: none; }
  @media (max-width: 640px) { header.top .logo, .drawer-head .logo { display: none; } .foot-brand { display: flex; } }

  /* menu: a sidebar on wide screens (shrinks to icons), a slide-in panel on phones and tablets */
  .drawer-bg { position: fixed; inset: 0; z-index: 40; background: rgb(10 16 30 / .45); opacity: 0; transition: opacity .2s; }
  .drawer-bg.open { opacity: 1; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41; width: min(var(--side), 84vw); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .22s ease, width .18s ease; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px calc(12px + env(safe-area-inset-bottom, 0px)) calc(10px + env(safe-area-inset-left, 0px)); overflow-y: auto; overflow-x: hidden; }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; min-height: 42px; }
  .drawer-head b { flex: 1; min-width: 0; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-head .iconbtn { color: var(--muted); }
  .drawer-head .iconbtn:hover { background: var(--sunk); }
  .drawer-acct { display: flex; flex-direction: column; gap: 6px; padding: 2px 4px 10px; margin-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .drawer-acct > span { overflow-wrap: anywhere; }
  .drawer-acct .acct-role { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
  .drawer-acct select { font-size: 13px; }
  .drawer nav { display: flex; flex-direction: column; gap: 1px; }
  .drawer .grp { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 12px 10px 4px; white-space: nowrap; }
  .drawer nav a { display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); font-weight: 500; font-size: 13.5px; white-space: nowrap; position: relative; -webkit-tap-highlight-color: transparent; }
  .drawer nav a svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  .drawer nav a:hover { background: var(--sunk); }
  .drawer nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .drawer nav a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--hi); }
  .drawer nav a[aria-current="page"] svg { color: var(--accent); }
  .drawer-foot { margin-top: auto; padding: 12px 4px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .drawer-foot button { justify-content: flex-start; }
  @media (min-width: 1024px) {
    body.side .drawer { transform: none; width: var(--side); z-index: 16; padding-top: 10px; top: calc(var(--headh) + env(safe-area-inset-top, 0px)); }
    body.side .drawer-head, body.side .drawer-bg { display: none; }
    body.side main, body.side .demobar { margin-left: var(--side); }
    body.side.mini .drawer { width: var(--side-mini); }
    body.side.mini main, body.side.mini .demobar { margin-left: var(--side-mini); }
    body.side.mini .drawer .grp { font-size: 0; padding: 0; border-top: 1px solid var(--line); margin: 6px 6px; }
    body.side.mini .drawer .grp:first-child { border: 0; margin: 0; }
    body.side.mini .drawer nav a { justify-content: center; padding: 9px 0; }
    body.side.mini .drawer nav a span { display: none; }
    body.side.mini .drawer-acct, body.side.mini .drawer-foot { display: none; }
    main, .demobar { transition: margin-left .18s ease; }
  }

  /* bottom bar on phones: the three main pages for this person */
  .botbar { display: none; }
  @media (max-width: 640px) {
    .botbar:not([hidden]) { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-left, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); box-shadow: 0 -2px 10px rgb(16 24 40 / .06); }
    .botbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; color: var(--muted); font-size: 11.5px; font-weight: 600; text-decoration: none; border-radius: var(--r-sm); -webkit-tap-highlight-color: transparent; }
    .botbar svg { width: 22px; height: 22px; }
    .botbar a[aria-current="page"] { color: var(--accent); }
    body.has-bot main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
    body.has-bot .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  }

  .demobar { background: var(--hi-soft); color: var(--hi-ink); border-bottom: 1px solid #f0d7a1; }
  .demobar .in { max-width: 1240px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13px; }
  .viewas { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .viewas select { width: auto; }
  table.access th.itemh { min-width: 120px; vertical-align: bottom; color: var(--ink); font-size: 12px; text-transform: none; letter-spacing: 0; white-space: normal; }
  table.access .itemhelp { font-weight: 400; margin-top: 2px; line-height: 1.3; }
  table.access th.roleh { text-align: left; font-weight: 400; font-size: 13.5px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); position: sticky; left: 0; border-right: 1px solid var(--line); }
  table.access td.cell { white-space: nowrap; }
  label.tick { display: flex; gap: 6px; align-items: center; font-size: 13.5px; cursor: pointer; padding: 2px 0; }
  label.tick input { width: 18px; height: 18px; }
  button.linkish { all: unset; cursor: pointer; color: var(--accent); font-size: 12.5px; text-decoration: underline; }
  button.linkish:focus-visible { outline: 2px solid var(--accent); }

  main { max-width: 1240px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  @media (min-width: 1024px) { body.side main { max-width: none; padding-inline: 28px; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
  .card > h2:first-child, .card > h3:first-child { font-size: 14.5px; font-weight: 600; letter-spacing: -.005em; margin: -14px -16px 12px !important; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { all: unset; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile:hover { border-color: var(--line-strong); }
  .tile.on { border-color: var(--accent); background: var(--accent-soft); }
  .tile b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile span { font-size: 12.5px; color: var(--muted); }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
  .filters label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .filters label > * { display: block; margin-top: 4px; min-width: 160px; }
  table.grid { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 13.5px; }
  table.grid th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
  table.grid td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.grid tr.click { cursor: pointer; }
  table.grid tbody tr:hover td { background: color-mix(in srgb, var(--sunk) 55%, transparent); }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .sub { border-top: 1px solid var(--line); padding: 10px 0; }
  .sub:first-child { border-top: 0; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13.5px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; }
  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 9px 16px; border-radius: var(--r); font-weight: 500; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgb(10 16 30 / .25); z-index: 70; }
  .signin { max-width: 420px; margin: 10vh auto; }
  .signin .or { display: flex; align-items: center; gap: 10px; color: var(--muted, #6b6a63); font-size: 13px; margin: 14px 0; }
  .signin .or::before, .signin .or::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  .signin .notice { background: #eaf4ec; color: #1f5130; border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }
  .signin.wide { max-width: 520px; margin-top: 6vh; }
  .signin form h2 { font-size: 16px; margin: 18px 0 8px; }
  .signin h1 { font-size: 20px; margin: 0 0 6px !important; padding: 0 !important; border: 0 !important; }
  .bunkcols { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
  @media (max-width: 760px) { .bunkcols { grid-template-columns: 1fr; } }
  .list button.item { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer; font-size: 13.5px; }
  .list button.item:hover { background: var(--sunk); }
  .list button.item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .list button.item:focus-visible { outline: 2px solid var(--accent); }
  details.msel { position: relative; }
  details.msel > summary { list-style: none; cursor: pointer; border: 1px solid var(--line-strong); border-radius: var(--r-sm); min-height: var(--ctl); display: flex; align-items: center; padding: 0 10px; background: var(--surface); font-size: 13.5px; white-space: nowrap; color: var(--ink); font-weight: 400; }
  details.msel > summary::-webkit-details-marker { display: none; }
  details.msel > summary::after { content: ' ▾'; color: var(--muted); margin-left: 4px; }
  .msel-box { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r); padding: 8px 12px; min-width: 200px; max-height: 340px; overflow-y: auto; box-shadow: 0 8px 24px rgb(10 16 30 / .12); color: var(--ink); font-weight: 400; }
  details.msel[style*="margin-left:auto"] .msel-box { left: auto; right: 0; }
  button.sortbtn { all: unset; cursor: pointer; font-weight: 600; color: var(--muted); }
  button.sortbtn:focus-visible { outline: 2px solid var(--accent); }
  @media print { header.top, .drawer, .drawer-bg, .botbar, .demobar, .noprint { display: none !important; } body.side main { margin-left: 0 !important; } body::before { display: none; } .wrap { overflow: visible; border: 0; box-shadow: none; } table.grid { font-size: 11px; } body, .card { background: #fff; border: 0; box-shadow: none; } }
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="top-in">
  <button class="iconbtn" id="menuBtn" aria-label="Open menu" aria-controls="drawer" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
  <a href="#" class="logo" aria-label="Home" tabindex="-1"></a><a href="#" class="brand" id="campName">Camp Roster</a>
  <span id="pageTitle"></span>
</div></header>
<div class="drawer-bg" id="drawerBg" hidden></div>
<aside class="drawer" id="drawer" aria-label="Main menu" aria-hidden="true" hidden></aside>
<div id="demobar" class="demobar" role="status" hidden></div>
<main id="main"><p class="muted">Loading…</p></main>
<nav class="botbar" id="botbar" aria-label="Quick navigation" hidden></nav>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="/demo-seed.js"></script>
<script src="/demo-db.js"></script>
<script src="/reg-form.js"></script>
<script src="/app.js"></script>
</body>
</html>
