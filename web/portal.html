<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#24492c">
<title>Camp forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Families: the SFSP app's look, sized like its parent form (bigger text, big tap targets). */
  :root { font-size: 17px; }
  header.top .top-in { max-width: 680px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 680px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
  h2 { font-size: 21px; }
  .small { font-size: 14px; }
  button, .btn { font-size: 16px; min-height: 48px; padding: 10px 18px; border-radius: 10px; }
  input[type=text], input[type=email], input[type=search], input[type=date], input[type=password], input[type=tel], input[type=number], select, textarea { font-size: 17px; min-height: 48px; padding: 11px 12px; border-radius: var(--r); }
  label.field { font-size: 15px; color: var(--ink); font-weight: 700; }
  .check input { width: 22px; height: 22px; }
  .chip { font-size: 13px; padding: 2px 10px; }
  .hello h1 { margin: 6px 0 4px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 14px 0 6px; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .camper { margin-top: 26px; }
  .camper h2 { margin: 0 0 8px; }
  .req { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); margin: 10px 0; }
  .req > button.head { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; min-height: 56px; }
  .req > button.head:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .req .title { flex: 1; font-weight: 700; }
  .req .sub { display: block; font-weight: 400; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .req .body { padding: 0 16px 16px; display: none; }
  .req.open { border-color: var(--line-strong); }
  .req.open .body { display: block; }
  .req.done .title { color: var(--muted); }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .files .f { font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); display: flex; gap: 6px; align-items: center; }
  .files .f button { all: unset; cursor: pointer; color: var(--muted); padding: 0 2px; }
  .reason { background: var(--bad-soft); color: var(--bad); padding: 10px 12px; border-radius: var(--r); margin-bottom: 12px; font-size: 16px; }
  .choice { display: flex; gap: 10px; margin: 10px 0 14px; }
  .choice label { flex: 1; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 12px; min-height: 48px; text-align: center; cursor: pointer; font-weight: 700; background: var(--surface); }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice input:checked + span { color: var(--accent); }
  .choice label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .choice label:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .consent-text { background: var(--sunk); padding: 12px; border-radius: var(--r); font-size: 16px; }
  .demonote { background: var(--hi-soft); border: 1px solid #f0d7a1; color: #4a3305; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; line-height: 1.45; }
  .alldone { text-align: center; padding: 28px 16px; background: var(--good-soft); border-radius: 10px; margin-top: 20px; }
</style>
</head>
<body>
<header class="top"><div class="top-in"><span class="brand" id="campName">Camp forms</span></div></header>
<main id="app" aria-live="polite">
  <p class="muted">Loading your forms…</p>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="/demo-seed.js"></script>
<script src="/demo-db.js"></script>
<script src="/portal.js"></script>
</body>
</html>
